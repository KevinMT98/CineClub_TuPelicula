<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario Teléfono Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center mb-4">Formulario Teléfono Cliente</h2>
        <form id="formTelefonoCliente" autocomplete="off">
            <div class="row mb-3">
                <div class="col-md-4">
                    <label for="txtIdTelefono" class="form-label">ID Teléfono</label>
                    <input type="text" class="form-control" id="txtIdTelefono" required />
                </div>
                <div class="col-md-4">
                    <label for="txtIdCliente" class="form-label">ID Cliente</label>
                    <input type="text" class="form-control" id="txtIdCliente" required />
                </div>
                <div class="col-md-4">
                    <label for="txtNumero" class="form-label">Número</label>
                    <input type="text" class="form-control" id="txtNumero" required />
                </div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="txtTipoTelefono" class="form-label">Tipo de Teléfono</label>
                    <input type="text" class="form-control" id="txtTipoTelefono" required />
                </div>
                <div class="col-md-6">
                    <label for="txtDescripcion" class="form-label">Descripción</label>
                    <input type="text" class="form-control" id="txtDescripcion" />
                </div>
            </div>

            <div class="mb-4 text-center">
                <button type="button" class="btn btn-info me-2"><i class="fas fa-search"></i> Buscar</button>
                <button type="button" class="btn btn-success me-2"><i class="fas fa-save"></i> Guardar</button>
                <button type="button" class="btn btn-primary me-2"><i class="fas fa-edit"></i> Modificar</button>
                <button type="reset" class="btn btn-secondary"><i class="fas fa-times"></i> Cancelar</button>
            </div>
        </form>

        <div class="table-responsive">
            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>ID Teléfono</th>
                        <th>ID Cliente</th>
                        <th>Número</th>
                        <th>Tipo</th>
                        <th>Descripción</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</body>
</html>
