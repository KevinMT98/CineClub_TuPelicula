<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet" />
    <style>
        body {
            min-height: 100vh;
            background: radial-gradient(circle at 50% 30%, #4e2a8e 0%, #1a1a2e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: rgba(30, 30, 60, 0.85);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            padding: 2.5rem 2rem 2rem 2rem;
            width: 350px;
            color: #fff;
        }

            .login-card .avatar {
                width: 80px;
                height: 80px;
                background: rgba(255,255,255,0.1);
                border-radius: 50%;
                margin: 0 auto 1.5rem auto;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .login-card .form-control {
                background: transparent;
                border: none;
                border-bottom: 1px solid #aaa;
                border-radius: 0;
                color: #fff;
                margin-bottom: 1.2rem;
            }

                .login-card .form-control:focus {
                    background: transparent;
                    color: #fff;
                    border-bottom: 2px solid #6c63ff;
                    box-shadow: none;
                }

                .login-card .form-control::placeholder {
                    color: #fff !important;
                    opacity: 1;
                }

                .login-card .form-control::-webkit-input-placeholder {
                    color: #fff !important;
                }

                .login-card .form-control::-moz-placeholder {
                    color: #fff !important;
                }

                .login-card .form-control:-ms-input-placeholder {
                    color: #fff !important;
                }

                .login-card .form-control:-ms-input-placeholder {
                    color: #fff !important;
                }

            .login-card .input-group-text {
                background: transparent;
                border: none;
                color: #fff;
            }

            .login-card .form-check-label, .login-card a {
                font-size: 0.95rem;
            }

            .login-card .form-check-input {
                background-color: #222;
                border: 1px solid #666;
            }

            .login-card .login-btn {
                width: 100%;
                background: linear-gradient(90deg, #6c63ff 0%, #4e2a8e 100%);
                border: none;
                color: #fff;
                font-weight: 600;
                border-radius: 12px;
                padding: 0.7rem 0;
                margin-top: 1.2rem;
                letter-spacing: 1px;
                transition: background 0.2s;
            }

                .login-card .login-btn:hover {
                    background: linear-gradient(90deg, #4e2a8e 0%, #6c63ff 100%);
                }

            .login-card .row-options {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-top: -0.5rem;
            }

            .login-card a {
                color: #bdbdfc;
                text-decoration: none;
            }

                .login-card a:hover {
                    text-decoration: underline;
                }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="avatar">
            <i class="fas fa-user fa-3x"></i>
        </div>
        <form autocomplete="off">
            <div class="input-group mb-3">
                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                <input type="text" class="form-control" placeholder="Usuario" id="txtUsuario" required />
            </div>
            <div class="input-group mb-3">
                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                <input type="password" class="form-control" placeholder="Contraseña" id="txtPassword" required />
            </div>
            <div class="row-options mb-2">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="chkRecordar" />
                    <label class="form-check-label" for="chkRecordar">Guardar contraseña</label>
                </div>
                <a href="#" tabindex="0">¿Olvidó su contraseña?</a>
            </div>
            <button type="submit" class="btn login-btn">LOGIN</button>
        </form>
    </div>
</body>
</html>
