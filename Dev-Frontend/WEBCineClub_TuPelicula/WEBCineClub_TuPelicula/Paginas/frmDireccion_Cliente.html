<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Dirección Cliente</title>
    <link href="Estilos/adminlte.min.css" rel="stylesheet" />
    <link href="Estilos/select2.min.css" rel="stylesheet" />
    <link href="Estilos/select2-bootstrap4.min.css" rel="stylesheet" />
    <link href="Estilos/datatables.min.css" rel="stylesheet" />
</head>
<body class="hold-transition sidebar-mini">

    <section class="content">
        <div class="container-fluid">
            <div class="card card-primary mt-3">
                <div class="card-header">
                    <h3 class="card-title">Formulario de Dirección de Cliente</h3>
                </div>

                <form id="formDireccionCliente">
                    <div class="card-body">

                        <div class="form-row">
                            <div class="form-group col-md-4">
                                <label for="documento">Documento del Cliente</label>
                                <input type="text" class="form-control" id="documento" name="documento" placeholder="Cédula o NIT">
                            </div>
                            <div class="form-group col-md-6">
                                <label for="nombre">Nombre del Cliente</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" readonly>
                            </div>
                            <div class="form-group col-md-2 d-flex align-items-end">
                                <button type="button" id="btnBuscar" class="btn btn-info w-100">Buscar</button>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="ciudad">Ciudad</label>
                            <select id="ciudad" name="FK_id_ciudad" class="form-control select2" style="width: 100%;">
                                <option value="">Seleccione una ciudad</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="direccion">Dirección</label>
                            <input type="text" class="form-control" id="direccion" name="direccion" placeholder="Ingrese la dirección del cliente">
                        </div>

                        <div class="form-group">
                            <button type="submit" class="btn btn-primary">Guardar Dirección</button>
                            <button type="reset" class="btn btn-secondary">Limpiar</button>
                        </div>
                    </div>
                </form>
            </div>

            <div class="card mt-3">
                <div class="card-header">
                    <h3 class="card-title">Direcciones Asociadas</h3>
                </div>
                <div class="card-body">
                    <table id="tablaDirecciones" class="table table-bordered table-striped">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Ciudad</th>
                                <th>Dirección</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Datos dinámicos -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </section>

    <script src="Scripts/jquery.min.js"></script>
    <script src="Scripts/select2.min.js"></script>
    <script src="Scripts/datatables.min.js"></script>

    <script>
    </script>

</body>
</html>
