<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario Tipo de Teléfono</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center mb-4">Formulario Tipo de Teléfono</h2>
        <form id="formTipoTelefono" autocomplete="off">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="cboTipoTelefono" class="form-label">Tipo de Teléfono</label>
                    <select class="form-control" id="cboTipoTelefono" required>
                        <!-- Opciones generadas dinámicamente -->
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="txtDescripcionTipo" class="form-label">Descripción</label>
                    <input type="text" class="form-control" id="txtDescripcionTipo" required />
                </div>
            </div>
            <div class="mb-4 text-center">
                <button type="button" class="btn btn-info me-2"><i class="fas fa-search"></i> Buscar</button>
                <button type="button" class="btn btn-success me-2"><i class="fas fa-save"></i> Guardar</button>
                <button type="button" class="btn btn-primary me-2"><i class="fas fa-edit"></i> Modificar</button>
                <button type="reset" class="btn btn-secondary"><i class="fas fa-times"></i> Cancelar</button>
            </div>
        </form>

        <div class="table-responsive">
            <table class="table table-bordered table-striped">
                <thead class="table-dark">
                    <tr>
                        <th>ID Tipo</th>
                        <th>Descripción</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</body>
</html>
