<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estado de Conservación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body class="bg-light">

    <div class="container mt-5">
        <h2 class="text-center mb-4">Formulario Estado de Conservación</h2>

        <!-- Formulario -->
        <form id="formEstadoConservacion" autocomplete="off">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="txtIdEstadoConservacion" class="form-label">ID Estado de Conservación</label>
                    <input type="text" class="form-control" id="txtIdEstadoConservacion" name="txtIdEstadoConservacion" required pattern="^\d+$" title="Ingrese solo números" />
                </div>
                <div class="col-md-6">
                    <label for="txtDescripcionEstadoConservacion" class="form-label">Descripción</label>
                    <input type="text" class="form-control" id="txtDescripcionEstadoConservacion" name="txtDescripcionEstadoConservacion" required />
                </div>
            </div>

            <!-- Botones -->
            <div class="mb-4 text-center">
                <button type="button" id="btnBuscar" class="btn btn-info me-2">
                    <i class="fas fa-search"></i> Buscar
                </button>
                <button type="button" id="btnGuardar" class="btn btn-success me-2">
                    <i class="fas fa-save"></i> Guardar
                </button>
                <button type="button" id="btnModificar" class="btn btn-primary me-2">
                    <i class="fas fa-edit"></i> Modificar
                </button>
                <button type="reset" id="btnCancelar" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancelar
                </button>
            </div>
        </form>

        <!-- Tabla de datos -->
        <div class="table-responsive">
            <table id="tblEstadoConservacion" class="table table-striped table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID Estado de Conservación</th>
                        <th>Descripción</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Filas generadas dinámicamente -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- JS Bootstrap + tu script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="conservacion.js"></script>
</body>
</html>
