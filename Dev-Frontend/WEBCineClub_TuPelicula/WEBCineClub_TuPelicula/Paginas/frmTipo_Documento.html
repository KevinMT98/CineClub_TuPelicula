<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Tipo de Documento</title>
    <link href="Estilos/adminlte.min.css" rel="stylesheet" />
    <link href="Estilos/datatables.min.css" rel="stylesheet" />
</head>
<body class="hold-transition sidebar-mini">

    <section class="content">
        <div class="container-fluid">

            <div class="card card-primary mt-3">
                <div class="card-header">
                    <h3 class="card-title">Gestión de Tipo de Documento</h3>
                </div>

                <form id="formTipoDocumento">
                    <div class="card-body">
                        <input type="hidden" id="id_tipo" name="id_tipo">

                        <div class="form-group">
                            <label for="nombre_tipo">Nombre del Tipo de Documento</label>
                            <input type="text" class="form-control" id="nombre_tipo" name="nombre_tipo" placeholder="Ej: Cédula de Ciudadanía" required>
                        </div>

                        <div class="form-group d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Guardar</button>
                            <button type="button" id="btnActualizar" class="btn btn-warning" disabled>Actualizar</button>
                            <button type="button" id="btnEliminar" class="btn btn-danger" disabled>Eliminar</button>
                            <button type="reset" class="btn btn-secondary" id="btnLimpiar">Limpiar</button>
                        </div>
                    </div>
                </form>
            </div>

            <div class="card mt-3">
                <div class="card-header">
                    <h3 class="card-title">Listado de Tipos de Documento</h3>
                </div>
                <div class="card-body">
                    <table id="tablaTipoDocumento" class="table table-bordered table-striped">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Datos dinámicos -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </section>

    <script src="Scripts/jquery.min.js"></script>
    <script src="Scripts/datatables.min.js"></script>

    <script>
    </script>

</body>
</html>
