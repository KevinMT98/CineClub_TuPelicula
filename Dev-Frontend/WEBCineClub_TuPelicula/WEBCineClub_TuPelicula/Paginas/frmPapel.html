<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Maestro de Papel</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <link href="Estilos/adminlte.min.css" rel="stylesheet" />
    <link href="Estilos/css/all.min.css" rel="stylesheet" />
    <link href="Estilos/dataTables.min.css" rel="stylesheet" />
    <link href="Estilos/dataTables.bootstrap4.min.css" rel="stylesheet" />
</head>
<body class="hold-transition sidebar-mini">
    <section class="content">
        <div class="container-fluid">
            <div class="row">
                <div class="col-md-12" id="dvMenu"></div>
                <div class="col-md-12">
                    <div class="card card-primary">
                        <div class="card-header">
                            <h3 class="card-title">Maestro de Papel</h3>
                        </div>
                        <form id="formPapel" autocomplete="off">
                            <div class="card-body">
                                <div class="card card-gray-dark">
                                    <div class="card-header">
                                        <h3 class="card-title">Datos de Entrada</h3>
                                    </div>
                                    <div class="card-body">
                                        <div class="row mb-3">
                                            <div class="col-md-4">
                                                <div class="form-group">
                                                    <label for="txtIdPapel">ID Papel</label>
                                                    <input type="text" class="form-control" id="txtIdPapel" name="txtIdPapel" readonly />
                                                </div>
                                            </div>
                                            <div class="col-md-6">
                                                <div class="form-group">
                                                    <label for="txtDescripcionPapel">Descripción</label>
                                                    <input type="text" class="form-control" id="txtDescripcionPapel" name="txtDescripcionPapel" required />
                                                </div>
                                            </div>
                                            <!-- Si tu tabla tiene campo Activo, descomenta esto:
                                            <div class="col-md-2 d-flex align-items-end">
                                                <div class="form-check">
                                                    <input type="checkbox" id="chkActivo" class="form-check-input" />
                                                    <label class="form-check-label" for="chkActivo">Activo</label>
                                                </div>
                                            </div>
                                            -->
                                        </div>
                                    </div>
                                    <!-- Botones de acción -->
                                    <div class="card-body">
                                        <div class="row">
                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <button type="button" id="btnBuscar" class="btn-block btn-lg btn-info"><i class="fas fa-search"></i> Buscar</button>
                                                </div>
                                            </div>
                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <button type="button" id="btnGuardar" class="btn-block btn-lg btn-success"><i class="fas fa-save"></i> Guardar</button>
                                                </div>
                                            </div>
                                            <div class="col-md-2">
                                                <div class="form-group">
                                                    <button type="button" id="btnModificar" class="btn-block btn-lg btn-primary"><i class="fas fa-edit"></i> Modificar</button>
                                                </div>
                                            </div>
                                            <div class="col-md-2">
                                                <div class="form-group">
                                                    <button type="reset" id="btnCancelar" class="btn-block btn-lg btn-secondary"><i class="fas fa-times"></i> Cancelar</button>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="card-footer">
                                            <div id="dvMensaje" class=""></div>
                                        </div>
                                    </div>
                                </div>
                                <!-- Tabla de datos -->
                                <div class="row">
                                    <div class="col-md-12">
                                        <table id="tblPapel" class="table table-bordered table-striped">
                                            <thead>
                                                <tr>
                                                    <th>ID Papel</th>
                                                    <th>Descripción</th>
                                                    <!-- <th>Activo</th> -->
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <!-- Filas generadas dinámicamente -->
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- Scripts -->
    <script src="../Scripts/jquery-3.7.0.min.js"></script>
    <script src="../Scripts/bootstrap.bundle.min.js"></script>
    <script src="../Scripts/jquery.dataTables.min.js"></script>
    <script src="../Scripts/dataTables.bootstrap4.min.js"></script>
    <script src="Scripts/frmPapel.js"></script>
</body>
</html>
