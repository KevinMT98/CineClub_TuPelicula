<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario Papel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body class="bg-light">

    <div class="container mt-5">
        <h2 class="text-center mb-4">Formulario Papel</h2>

        <!-- Formulario -->
        <form id="formPapel" autocomplete="off">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="txtIdPapel" class="form-label">ID Papel</label>
                    <input type="text" class="form-control" id="txtIdPapel" name="txtIdPapel" required pattern="^\d+$" />
                </div>
                <div class="col-md-6">
                    <label for="txtDescripcionPapel" class="form-label">Descripción</label>
                    <input type="text" class="form-control" id="txtDescripcionPapel" name="txtDescripcionPapel" required />
                </div>
            </div>

            <!-- Botones -->
            <div class="mb-4 text-center">
                <button type="button" id="btnBuscar" class="btn btn-info me-2">
                    <i class="fas fa-search"></i> Buscar
                </button>
                <button type="button" id="btnGuardar" class="btn btn-success me-2">
                    <i class="fas fa-save"></i> Guardar
                </button>
                <button type="button" id="btnModificar" class="btn btn-primary me-2">
                    <i class="fas fa-edit"></i> Modificar
                </button>
                <button type="reset" id="btnCancelar" class="btn btn-secondary">
                    <i class="fas fa-times"></i> Cancelar
                </button>
            </div>
        </form>

        <!-- Tabla -->
        <div class="table-responsive">
            <table id="tblPapel" class="table table-striped table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>ID Papel</th>
                        <th>Descripción</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Datos generados dinámicamente -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="papel.js"></script>
</body>
</html>
