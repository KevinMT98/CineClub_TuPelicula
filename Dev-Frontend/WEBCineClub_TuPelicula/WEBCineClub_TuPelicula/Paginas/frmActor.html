<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Maestro de Actor</title>
    <!-- Google Font: Source Sans Pro -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
    <!-- AdminLTE & FontAwesome -->
    <link href="Estilos/adminlte.min.css" rel="stylesheet" />
    <link href="Estilos/css/all.min.css" rel="stylesheet" />
    <!-- Select2 -->
    <link href="Estilos/select2.min.css" rel="stylesheet" />
    <link href="Estilos/select2-bootstrap4.min.css" rel="stylesheet" />
</head>
<body>
    <div class="container mt-4">
        <div class="card card-primary">
            <div class="card-header">
                <h3 class="card-title">Maestro de Actor</h3>
            </div>
            <form id="frmActor">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="txtNombreActor">Nombre:</label>
                                <input type="text" id="txtNombreActor" class="form-control" placeholder="Nombre del actor">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label for="cboNacionalidadActor">Nacionalidad:</label>
                                <select id="cboNacionalidadActor" class="form-control select2" style="width: 100%;"></select>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <label for="cboGeneroActor">Género:</label>
                                <select id="cboGeneroActor" class="form-control select2" style="width: 100%;"></select>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="txtFechaNacActor">Fecha Nacimiento:</label>
                                <input type="date" id="txtFechaNacActor" class="form-control">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="txtExperienciaActor">Años Experiencia:</label>
                                <input type="number" id="txtExperienciaActor" class="form-control">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="txtPremiosActor">Número de Premios:</label>
                                <input type="number" id="txtPremiosActor" class="form-control">
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-2 d-flex align-items-end">
                            <div class="form-check">
                                <input type="checkbox" id="chkActivoActor" class="form-check-input">
                                <label for="chkActivoActor" class="form-check-label">Activo</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card-body">
                    <div class="row">
                        <div class="col-md-3">
                            <div class="form-group">
                                <button type="button" id="btnAgre" class="btn-block btn-lg btn-primary">Agregar</button>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="form-group">
                                <button type="button" id="btnModi" class="btn-block btn-lg btn-primary">Modificar</button>
                            </div>
                        </div>
                        <div class="col-md-2">
                            <div class="form-group">
                                <button type="button" id="btnBusc" class="btn-block btn-lg btn-primary">Buscar</button>
                            </div>
                        </div>
                        <div class="col-md-2">
                            <div class="form-group">
                                <button type="button" id="btnCanc" class="btn-block btn-lg btn-primary">Cancelar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
