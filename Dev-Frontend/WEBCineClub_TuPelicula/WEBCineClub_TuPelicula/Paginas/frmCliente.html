<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maestro de Cliente</title>

    <!-- Estilos -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback" />
    <link href="Estilos/adminlte.min.css" rel="stylesheet" />
    <link href="Estilos/css/all.min.css" rel="stylesheet" />
    <link href="Estilos/select2.min.css" rel="stylesheet" />
    <link href="Estilos/select2-bootstrap4.min.css" rel="stylesheet" />
    <link href="Estilos/dataTables.min.css" rel="stylesheet" />
    <link href="Estilos/dataTables.bootstrap4.min.css" rel="stylesheet" />
</head>
<body class="hold-transition sidebar-mini">
    <section class="content">
        <div class="container-fluid">
            <div class="row">
                <div class="col-md-12" id="dvMenu"></div>

                <div class="col-md-12">
                    <div class="card card-primary">
                        <div class="card-header">
                            <h3 class="card-title">Maestro de Cliente</h3>
                        </div>
                        <form id="frmCliente">
                            <div class="card-body">
                                <div class="card card-gray-dark">
                                    <div class="card-header">
                                        <h3 class="card-title">Datos del Cliente</h3>
                                    </div>
                                    <div class="card-body">
                                        <div class="row">
                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="txtNroDoc">Nro. Documento:</label>
                                                    <input type="text" id="txtNroDoc" class="form-control" placeholder="Ingrese el número de documento..." />
                                                </div>
                                            </div>
                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="cboTipoDoc">Tipo Documento:</label>
                                                    <select id="cboTipoDoc" class="form-control"></select>
                                                </div>
                                            </div>
                                            <div class="col-md-6">
                                                <div class="form-group">
                                                    <label for="txtNombre">Nombre Completo:</label>
                                                    <input type="text" id="txtNombre" class="form-control" placeholder="Ingrese el nombre del cliente..." />
                                                </div>
                                            </div>
                                        </div>

                                        <div class="row">
                                            <div class="col-md-6">
                                                <div class="form-group">
                                                    <label for="txtDireccion">Dirección:</label>
                                                    <input type="text" id="txtDireccion" class="form-control" placeholder="Ingrese dirección..." />
                                                </div>
                                            </div>
                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="txtTelefono">Teléfono:</label>
                                                    <input type="text" id="txtTelefono" class="form-control" placeholder="Teléfono..." />
                                                </div>
                                            </div>
                                            <div class="col-md-3">
                                                <div class="form-group">
                                                    <label for="txtCorreo">Correo Electrónico:</label>
                                                    <input type="email" id="txtCorreo" class="form-control" placeholder="Correo electrónico..." />
                                                </div>
                                            </div>
                                        </div>

                                        <div class="row">
                                            <div class="col-md-1 d-flex align-items-end">
                                                <div class="form-check">
                                                    <input type="checkbox" id="chkActivo" class="form-check-input" />
                                                    <label class="form-check-label" for="chkActivo">Activo</label>
                                                </div>
                                            </div>
                                            <div class="col-md-11">
                                                <div class="form-group">
                                                    <label for="txtObserv">Observaciones:</label>
                                                    <textarea id="txtObserv" rows="3" class="form-control" placeholder="Datos adicionales u observaciones..."></textarea>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Botones -->
                                    <div class="card-body">
                                        <div class="row">
                                            <div class="col-md-3">
                                                <button type="button" id="btnAgre" class="btn-block btn-lg btn-primary">Agregar</button>
                                            </div>
                                            <div class="col-md-3">
                                                <button type="button" id="btnModi" class="btn-block btn-lg btn-primary">Modificar</button>
                                            </div>
                                            <div class="col-md-2">
                                                <button type="button" id="btnBusc" class="btn-block btn-lg btn-primary">Buscar</button>
                                            </div>
                                            <div class="col-md-2">
                                                <button type="button" id="btnCanc" class="btn-block btn-lg btn-primary">Cancelar</button>
                                            </div>
                                            <div class="col-md-2">
                                                <button type="button" id="btnImpr" class="btn-block btn-lg btn-primary">Impresión</button>
                                            </div>
                                        </div>

                                        <div class="card-footer">
                                            <div id="dvMensaje"></div>
                                        </div>
                                    </div>
                                </div>

                                <!-- Tabla -->
                                <div class="row">
                                    <div class="col-md-12">
                                        <table id="tablaClientes" class="table table-bordered table-striped">
                                            <thead>
                                                <tr>
                                                    <th>ID</th>
                                                    <th>Documento</th>
                                                    <th>Nombre</th>
                                                    <th>Teléfono</th>
                                                    <th>Correo</th>
                                                    <th>Activo</th>
                                                </tr>
                                            </thead>
                                            <tbody></tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Scripts -->
    <script src="../Scripts/jquery-3.7.0.min.js"></script>
    <script src="../Scripts/bootstrap.bundle.min.js"></script>
    <script src="../Scripts/select2.min.js"></script>
    <script src="Scripts/Comunes/Combos.js"></script>
    <script src="../Scripts/jquery.dataTables.min.js"></script>
    <script src="../Scripts/dataTables.bootstrap4.min.js"></script>
    <script src="Scripts/Comunes/Tablas.js"></script>
    <script src="Scripts/frmCliente.js"></script>
</body>
</html>
